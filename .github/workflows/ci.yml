name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 lGUI --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test import
        run: |
          python -c "import lGUI; print(f'lGUI version: {lGUI.__version__}')"

      - name: Test basic functionality
        run: |
          python -c "
          import lGUI as lg
          # Test shorthand parsing
          from lGUI.core.shorthand import parse_shorthand
          result = parse_shorthand('B:测试|bg=primary')
          print(f'Shorthand parsing: OK')
          # Test style
          from lGUI.core.style import Style
          s = Style.from_string('color=red,bold=True')
          print(f'Style parsing: OK')
          print('All tests passed!')
          "
